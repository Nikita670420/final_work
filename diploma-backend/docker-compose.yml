version: '3.8'
services:
  db:
    image: postgres:13
    environment:
      POSTGRES_DB: diploma-backend1
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
  redis:
    image: redis:alpine
  celery:
    build: .
    command: celery -A diploma-backend1 worker -l info
    depends_on:
      - redis